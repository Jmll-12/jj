const $=s=>document.querySelector(s);
const st={get(k,d){try{const v=localStorage.getItem('seo_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('seo_'+k,JSON.stringify(v))}catch(e){}}};
const plain=h=>h.replace(/<rt>.*?<\/rt>/g,'').replace(/<[^>]+>/g,'');
function card(tag,q,inner,cls=''){const c=document.createElement('div');c.className='card';
  c.innerHTML=`<button class="qh" aria-expanded="false"><span class="tag ${cls}">${tag}</span><span class="qt jp">${q}</span><span class="chev">›</span></button><div class="body">${inner}</div>`;
  const b=c.firstElementChild;b.onclick=()=>{c.classList.toggle('open');b.setAttribute('aria-expanded',c.classList.contains('open'))};return c}

/* toggles */
function tog(id,key,cls,def){const b=$(id);let on=st.get(key,def);
  const ap=()=>{b.setAttribute('aria-pressed',on);document.body.classList.toggle(cls,!on)};ap();
  b.onclick=()=>{on=!on;st.set(key,on);ap()}}
tog('#tgFuri','furi','nofuri',true);tog('#tgId','idn','noid',true);

/* tabs */
const tabs=[...document.querySelectorAll('.tabs button')];
function go(v){tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);st.set('tab',v);window.scrollTo(0,0)}
tabs.forEach(t=>t.onclick=()=>go(t.dataset.v));

(function(){const v=$('#v-honban');
  const T=null;
  v.innerHTML=`<div class="hero"><div class="lbl">株式会社THEO TEC（セオテック）· 1次選考 · SE · GOOGLE MEET</div>

    const dd=Math.floor(d/864e5),h=Math.floor(d/36e5)%24,m=Math.floor(d/6e4)%60,s=Math.floor(d/1e3)%60;
    el.textContent=`${dd}日 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};
  tick();setInterval(tick,1000);
  const CK=['Klik "Uji penyiapan Anda" di email Meet: cek kamera & mic (H-1)','Nama tampilan Meet: Muhamad Jamal Alhafizt','Laptop dicas penuh + charger tersambung','Kamera sejajar mata, cahaya dari depan, latar dinding polos','Kamar sepi, notifikasi HP & PC dimatikan','Earphone bermik siap (lebih jelas dari speaker)','Kemeja/jas rapi (atas saja pun harus rapi)','Catatan kecil di dekat kamera: 志望動機 + 逆質問','Baca ulang theotech.jp (事業・代表メッセージ・採用) + 履歴書 THEO TEC','Siap jawab コース: 「システムエンジニア職を希望いたします」 (dipilih di dalam 1次面接)','Baca ulang info Mynavi (proyek SE, 無期雇用派遣, 未経験97%)','Masuk Meet 5 menit sebelum jam mulai, tunggu dengan sikap duduk tegak'];
  const done=st.get('ck',[]);const ck=$('#ck');

  DATA.core.forEach(([sec,q,a,id])=>$('#core').appendChild(card(sec,q,`<div class="ans jp">${a}</div><div class="idn">🇮🇩 ${id}</div>`)));
  DATA.tr.forEach(([q,a,id])=>$('#tr').appendChild(card('対応',q,`<div class="ans jp">${a}</div><div class="idn">🇮🇩 ${id}</div>`)));

(function(){const v=$('#v-jiko');
  const vers=DATA.core.filter(c=>c[0]==='自己紹介'||c[0]==='自己PR'||c[0]==='経歴'||c[0]==='志望動機').slice(0,5);
  const names=['1分','30秒','自己PR','転職理由','志望動機'];
  v.innerHTML=`<h2>自己紹介を覚える</h2><p class="muted">Pilih versi. Nyalakan <b>Sembunyikan</b>, coba ucapkan, lalu tap kalimat untuk cek. Pakai stopwatch untuk menakar waktu.</p>
   <div class="chips" id="jv"></div>
   <div class="row"><button class="btn" id="hideBtn" aria-pressed="false">Sembunyikan</button><button class="btn" id="showAll">Buka semua</button></div>
   <div class="script jp" id="sc"></div>
   <div class="timer" id="tm">0:00</div>
   <div class="row" style="justify-content:center"><button class="btn pri" id="tmGo">Mulai</button><button class="btn" id="tmRe">Reset</button></div>
   <p class="muted" id="tmHint"></p>`;
  let cur=0;
  const render=()=>{const h=vers[cur][2];const parts=h.split(/(?<=。)/).filter(x=>x.trim());
    $('#sc').innerHTML=parts.map(p=>`<span class="sent">${p}</span>`).join('');
    $('#sc').querySelectorAll('.sent').forEach(s=>s.onclick=()=>s.classList.toggle('shown'));
    const n=plain(h).length;$('#tmHint').textContent=`${n} karakter ≈ ${Math.round(n/5)} detik (tempo wawancara ±300 karakter/menit). Target: ${names[cur]==='1分'?'55–65 detik':names[cur]==='30秒'?'25–35 detik':'maks. 60 detik'}.`;
    [...$('#jv').children].forEach((c,i)=>c.setAttribute('aria-pressed',i===cur))};
  names.forEach((n,i)=>{const c=document.createElement('button');c.className='chip';c.textContent=n;c.onclick=()=>{cur=i;render()};$('#jv').appendChild(c)});
  let hide=false;$('#hideBtn').onclick=e=>{hide=!hide;document.body.classList.toggle('hide',hide);e.target.setAttribute('aria-pressed',hide);e.target.className=hide?'btn pri':'btn';$('#sc').querySelectorAll('.sent').forEach(s=>s.classList.remove('shown'))};
  $('#showAll').onclick=()=>$('#sc').querySelectorAll('.sent').forEach(s=>s.classList.add('shown'));
  let t0=0,acc=0,iv=null;const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  const upd=()=>{const ms=acc+(iv?Date.now()-t0:0);$('#tm').textContent=fmt(ms);$('#tm').classList.toggle('over',ms>(names[cur]==='30秒'?35e3:65e3))};
  $('#tmGo').onclick=e=>{if(iv){acc+=Date.now()-t0;clearInterval(iv);iv=null;e.target.textContent='Lanjut'}else{t0=Date.now();iv=setInterval(upd,200);e.target.textContent='Stop'}};
  $('#tmRe').onclick=()=>{clearInterval(iv);iv=null;acc=0;$('#tmGo').textContent='Mulai';upd()};
  render();
})();

(function(){const v=$('#v-q');

  let th=st.get('qth','すべて'),rk=st.get('qrk','all'),q='',shown=30;
  themes.forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;c.onclick=()=>{th=t;st.set('qth',t);shown=30;draw()};$('#qt').appendChild(c)});

  $('#qs').oninput=e=>{q=e.target.value.trim();shown=30;draw()};

    const L=DATA.fw.map((x,i)=>[x,i]).filter(([x,i])=>(th==='すべて'||x[0]===th)&&(rk==='all'||rk.includes(x[1]))&&(!q||idx[i].toLowerCase().includes(q.toLowerCase())));
    $('#qc').textContent=L.length+' soal';const ql=$('#ql');ql.innerHTML='';
    L.slice(0,shown).forEach(([x])=>{const [t,r,qq,a,tip,ng,ngr,id]=x;

    $('#qm').hidden=L.length<=shown}
  draw();
})();
